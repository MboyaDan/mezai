# Local development stack. Host ports can be changed in backend/.env.
name: mezai

services:
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: postgres://${POSTGRES_USER:-mezai}:${POSTGRES_PASSWORD:-mezai_dev_only}@postgres:5432/${POSTGRES_DB:-mezai}?sslmode=disable
      S3_ENDPOINT: http://storage:8333
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-mezai-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mezai_dev_key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mezai_dev_secret_only}
      S3_USE_PATH_STYLE: "true"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Requests reach the container through Docker's network gateway; local
      # rate limits therefore count all local traffic as one client.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      SESSION_TTL: ${SESSION_TTL:-168h}
      SESSION_IDLE: ${SESSION_IDLE:-48h}
      SMTP_ADDR: mailpit:1025
      MAIL_FROM: ${MAIL_FROM:-MezAI <no-reply@mezai.invalid>}
      ENQUIRY_NOTIFY_TO: ${ENQUIRY_NOTIFY_TO:-ops@mezai.invalid}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mezai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mezai_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-mezai}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. MinIO images are no longer published, so
  # SeaweedFS stands in (D-012). `mini` runs everything in one process and
  # creates S3_BUCKET on start; the AWS_* variables become the admin key.
  storage:
    image: chrislusf/seaweedfs:4.50
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mezai_dev_key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mezai_dev_secret_only}
      S3_BUCKET: ${S3_BUCKET:-mezai-dev}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  pgdata:
  s3data:
