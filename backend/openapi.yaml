openapi: 3.1.0
info:
  title: MezAI API
  version: 0.1.0
  description: |
    Contract for the MezAI API. The browser calls `/api/*` on the frontend
    origin; Next.js rewrites those requests to this API with the `/api`
    prefix removed. Frontend types are generated from this file.
security:
  - session: []
servers:
  - url: /api
    description: Through the Next.js rewrite
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness. The process is up; dependencies are not checked.
      tags: [system]
      responses:
        "200":
          description: Up
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      security: []
      summary: Readiness. Database and object storage are reachable.
      tags: [system]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password. Sets the session cookie.
      description: |
        Wrong password, unknown email, locked and disabled accounts all return
        the same 401, so the response never reveals whether an email is
        registered. Five wrong passwords lock the account for 15 minutes.
        Limited to 20 requests a minute per IP and 10 per 15 minutes per email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "`mezai_session`: HttpOnly, Secure, SameSite=Lax, Path=/"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`email_not_verified`, `account_not_ready` or `csrf_failed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out. Revokes the session and clears the cookie.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/CSRF"
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/auth/me:
    get:
      operationId: getMe
      summary: The signed-in user, their permission keys and the CSRF token.
      tags: [auth]
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Email a reset link (1 hour) if the address has an active account. Always 202.
      tags: [auth]
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/TooMany" }
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password from a reset link. Signs out every session and clears lockout.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/WeakPassword" }
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address from a verification link (24 hours).
      tags: [auth]
      security: []
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "204": { description: Verified }
        "400": { $ref: "#/components/responses/Error" }
  /v1/auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Send a new verification link to an unverified account. Always 202.
      tags: [auth]
      security: []
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "429": { $ref: "#/components/responses/TooMany" }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Create the invited account (email verified) and set its password.
      tags: [accounts]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, display_name, password]
              properties:
                token: { type: string }
                display_name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Account created; sign in next }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/WeakPassword" }
  /v1/invitations:
    get:
      operationId: listInvitations
      summary: Pending invitations. Staff see all; a Client Admin sees their organisation's.
      description: "Requires `user.manage` or `org.user.invite`."
      tags: [accounts]
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvitation
      summary: Invite a staff or client user (link valid 7 days).
      description: |
        Requires `user.manage` (any staff role, any organisation) or
        `org.user.invite` (client roles in the caller's own organisation).
        Roles holding `system.admin` and the contributor role are never
        invitable (`not_grantable`).
      tags: [accounts]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, description: "Role key, for example `reviewer` or `client_viewer`" }
                org_id: { type: string, format: uuid, description: "Required for client roles, forbidden for staff roles" }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      summary: Revoke a pending invitation.
      tags: [accounts]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /v1/users:
    get:
      operationId: listUsers
      summary: Staff and client users with their roles (`user.manage`).
      tags: [accounts]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/users/{id}/roles:
    post:
      operationId: grantRole
      summary: Grant a role (`user.manage`). Never a role holding `system.admin`; never mixes staff, client and contributor.
      tags: [accounts]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string }
                org_id: { type: string, format: uuid }
      responses:
        "204": { description: Granted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/users/{id}/roles/{role}:
    delete:
      operationId: removeRole
      summary: Remove a role (`user.manage`). Super Admin changes need `system.admin`; the last Super Admin cannot be demoted (409 `last_super_admin`).
      tags: [accounts]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { type: string } }
        - { name: org_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/users/{id}/status:
    post:
      operationId: setUserStatus
      summary: Enable or disable a user (`user.manage`). Disabling signs them out. Not yourself; never the last Super Admin.
      tags: [accounts]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        "204": { description: Changed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/roles:
    get:
      operationId: listRoles
      summary: Roles and their permission keys (`user.manage` or `role.manage`).
      tags: [accounts]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/roles/{key}/permissions:
    put:
      operationId: setRolePermissions
      summary: Replace a role's permission keys (`role.manage`). The Super Admin role is fixed; `system.admin` can never be added.
      tags: [accounts]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string } }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/permissions:
    get:
      operationId: listPermissions
      summary: Every permission key and whether it can be granted (`role.manage`).
      tags: [accounts]
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      required: [key, description, grantable]
                      properties:
                        key: { type: string }
                        description: { type: string }
                        grantable: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/stats:
    get:
      operationId: listStats
      summary: Published statistics for the public site, each with its source and verification date.
      description: No record, no number (honesty rule 2). Cached for 5 minutes.
      tags: [public]
      security: []
      responses:
        "200":
          description: Published statistics (often empty)
          content:
            application/json:
              schema:
                type: object
                required: [stats]
                properties:
                  stats:
                    type: array
                    items: { $ref: "#/components/schemas/PublicStat" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/enquiries:
    post:
      operationId: createEnquiry
      summary: Submit a project enquiry from the public contact form.
      description: >-
        Saved with status `new`, emailed to the ops inbox (ENQUIRY_NOTIFY_TO) and audited
        without personal details. A filled honeypot (`website`) gets the same 202 and stores
        nothing. Limits: 5 an hour per IP, 3 a day per email address. When TURNSTILE_SECRET_KEY
        is set (DG-07), `turnstile_token` is required and checked with Cloudflare; if the check
        cannot run, the request fails closed with 503. Cross-origin requests are refused.
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryRequest" }
      responses:
        "202":
          description: Received (also returned for honeypot hits)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [received] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: >-
            `invalid_enquiry` with a code per field (`required`, `too_long`, `invalid`),
            or `challenge_failed` when the Turnstile token is missing or wrong.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [invalid_enquiry, challenge_failed] }
                  fields:
                    type: object
                    additionalProperties: { type: string, enum: [required, too_long, invalid] }
        "429": { $ref: "#/components/responses/TooMany" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/contributors/signup:
    post:
      operationId: contributorSignUp
      summary: Contributor self sign-up (brief 6.2, AC-04).
      description: >-
        Creates an unverified contributor in status `applied`, stores consent to the current
        privacy notice and contributor terms (version, time and IP), and emails a verification
        link. A registered email gets the same 202 and nothing changes (an unverified
        contributor gets a fresh link). Limits: 10 an hour per IP, 5 an hour per address.
      tags: [contributors]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password, consents]
              properties:
                email: { type: string, format: email }
                display_name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 12 }
                consents:
                  type: object
                  description: Document key → accepted version. Must hold the current version of `privacy_notice` and `contributor_terms`.
                  additionalProperties: { type: string }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: "`consent_required`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/WeakPassword" }
        "429": { $ref: "#/components/responses/TooMany" }
  /v1/me/contributor:
    get:
      operationId: getMyContributorProfile
      summary: The caller's contributor profile (`profile.manage`). Staff get 403 `not_a_contributor`.
      tags: [contributors]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/contributor/profile:
    put:
      operationId: updateMyContributorProfile
      summary: Replace the caller's profile. A complete `applied` profile moves to `qualifying`.
      description: >-
        Languages and domains are replaced as sets. Leave both M-Pesa fields empty to keep
        the stored number; a new number must be entered twice and is stored in E.164. Removed
        contributors get 403 `not_eligible`.
      tags: [contributors]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContributorProfileInput" }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/contributor/cv:
    put:
      operationId: uploadMyCV
      summary: Upload an optional CV (PDF, at most 2 MB), replacing any earlier one (`profile.manage`).
      description: >-
        Stored under a key built from IDs only. Deleted at once if the application is declined,
        otherwise 90 days after the screening decision (D-100). Limited to 10 uploads an hour.
      tags: [contributors]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv: { type: string, format: binary }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
    delete:
      operationId: deleteMyCV
      summary: Delete the caller's CV now.
      tags: [contributors]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
  /v1/me/contributor/consents:
    post:
      operationId: acceptConsents
      summary: Accept the current version of legal documents (asked again after a version change).
      tags: [contributors]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
        "409": { description: "`consent_required`: a version is not current (reload the document)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/qualification/tests:
    get:
      operationId: listMyQualificationTests
      summary: Active tests with the caller's state on each (`qualification.take`).
      tags: [qualification]
      responses:
        "200":
          description: Tests
          content:
            application/json:
              schema:
                type: object
                required: [tests]
                properties:
                  tests: { type: array, items: { $ref: "#/components/schemas/MyQualificationTest" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/qualification/tests/{id}/attempts:
    post:
      operationId: startQualificationAttempt
      summary: Start an attempt, or get the one already in progress.
      description: >-
        409 codes: `profile_incomplete` (status applied), `consent_required`,
        `already_qualified`, `retake_too_soon` (7 days after a rejection), `test_unavailable`,
        `attempt_closed` (submitted, waiting for Ops). 403 `not_eligible` when paused or removed.
      tags: [qualification]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Attempt, content: { application/json: { schema: { $ref: "#/components/schemas/QualificationAttempt" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/qualification/attempts/{id}:
    get:
      operationId: getMyQualificationAttempt
      summary: One of the caller's attempts. Expected answers are never included.
      tags: [qualification]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Attempt, content: { application/json: { schema: { $ref: "#/components/schemas/QualificationAttempt" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/me/qualification/attempts/{id}/answers:
    put:
      operationId: saveQualificationAnswers
      summary: Autosave draft answers on an open attempt (not validated beyond belonging to the test).
      tags: [qualification]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswersRequest" } } }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`attempt_closed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/qualification/attempts/{id}/submit:
    post:
      operationId: submitQualificationAttempt
      summary: Score the attempt and send it to the Ops queue.
      description: >-
        Uses `answers` when given, otherwise the saved draft. Every question needs a valid
        answer (422 names the first that does not). Submitting an attempt that is already
        scored returns it unchanged, so a retry cannot score twice.
      tags: [qualification]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AnswersRequest" } } }
      responses:
        "200": { description: Scored attempt, content: { application/json: { schema: { $ref: "#/components/schemas/QualificationAttempt" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/projects:
    get:
      operationId: listMyProjects
      summary: Live projects the caller may work on (`task.submit`). Needs active status, a verified identity and every required skill.
      tags: [tasks]
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/WorkProject" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/projects/{id}:
    get:
      operationId: getMyProject
      summary: One live project the caller may work on.
      tags: [tasks]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Project, content: { application/json: { schema: { $ref: "#/components/schemas/WorkProject" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/projects/{id}/next:
    post:
      operationId: nextTask
      summary: The caller's current task in the project, or a newly reserved one (one at a time).
      description: >-
        409 `no_tasks` when nothing is left for the caller. Gold items are mixed in at the
        project's rate and look exactly like other tasks (AC-06).
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Task, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/tasks/{id}:
    get:
      operationId: getTask
      summary: One of the caller's tasks. Content only while the reservation is live.
      tags: [tasks]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Task, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/me/tasks/{id}/draft:
    put:
      operationId: saveTaskDraft
      summary: Autosave an unfinished answer (a new revision when it changed).
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: "#/components/schemas/Answer" }
                time_on_task_ms: { type: integer, minimum: 0 }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/tasks/{id}/submit:
    post:
      operationId: submitTask
      summary: Submit the final answer once (AC-07).
      description: >-
        A retry with the same `Idempotency-Key` returns the first result and writes nothing.
        Another key on a submitted task is 409 `already_submitted`; a key already used on
        another task is 422 `idempotency_key_reused`. Blocking QA checks answer 422
        `qa_blocked` with `issues`; warnings are returned and stored for reviewers (D-077).
        The result is the same for gold and other items.
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,100}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: "#/components/schemas/Answer" }
                signals:
                  type: object
                  description: What the task screen saw; used only for warnings.
                  properties:
                    time_on_task_ms: { type: integer, minimum: 0 }
                    pasted_chars: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [submission_id, status, warnings]
                properties:
                  submission_id: { type: string, format: uuid }
                  status: { type: string }
                  warnings: { type: array, items: { $ref: "#/components/schemas/QAIssue" } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422":
          description: Invalid answer, key problem, or blocked by QA checks
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  field: { type: string }
                  message: { type: string }
                  issues: { type: array, items: { $ref: "#/components/schemas/QAIssue" } }
  /v1/me/tasks/{id}/skip:
    post:
      operationId: skipTask
      summary: Give a task back with a reason; the item never returns to the caller.
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [unclear, language, expertise, technical, other] }
                note: { type: string, maxLength: 1000, description: Required for `other` }
      responses:
        "204": { description: Skipped }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/tasks/{id}/report:
    post:
      operationId: reportTaskContent
      summary: Report an item's content. It leaves the caller's queue at once and nobody gets it while the report is open.
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string, enum: [harmful, personal_data, broken, other] }
                note: { type: string, maxLength: 1000, description: Required for `other` }
      responses:
        "204": { description: Reported }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/feedback:
    get:
      operationId: listMyFeedback
      summary: The caller's latest feedback (reviewers, and the automatic daily gold-miss note).
      description: The automatic note never names the items it refers to, so it cannot reveal which were gold (brief 8.1).
      tags: [tasks]
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                type: object
                required: [feedback]
                properties:
                  feedback:
                    type: array
                    items:
                      type: object
                      required: [id, body, project_id, project_name, automatic, read_at, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        body: { type: string }
                        project_id: { type: string, format: uuid }
                        project_name: { type: string }
                        automatic: { type: boolean }
                        read_at: { type: [string, "null"], format: date-time }
                        created_at: { type: string, format: date-time }
  /v1/me/feedback/{id}/read:
    post:
      operationId: markFeedbackRead
      summary: Mark one of the caller's notes as read.
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Marked }
  /v1/me/earnings:
    get:
      operationId: getMyEarnings
      summary: The caller's earnings card (`earnings.read_own`).
      description: >-
        Totals per currency from the append-only ledger: approved is the balance (accepted work and
        adjustments not yet paid), paid is payouts net of reversals, earned is accruals plus
        adjustments, so earned - paid = approved. Pending is an estimate: undecided answers at the
        project's current rate. Next payout date is null unless Ops has set one (D-119).
      tags: [earnings]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningsSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/earnings/statement:
    get:
      operationId: getMyStatement
      summary: The caller's statement, 30 days with entries per page, newest first (`earnings.read_own`).
      description: >-
        Accepted work is one line per Nairobi day and project (never per task, so a line cannot be
        matched to a gold item); payouts, reversals and adjustments are one line each. The lines of
        every page together sum to the approved balance.
      tags: [earnings]
      parameters:
        - name: before
          in: query
          required: false
          description: Nairobi date (YYYY-MM-DD); only days before it. The `before` of the previous page.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Statement page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/me/payouts:
    get:
      operationId: listMyPayouts
      summary: The caller's payout lines in batches past draft, newest first (`earnings.read_own`).
      tags: [earnings]
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                required: [payouts]
                properties:
                  payouts: { type: array, items: { $ref: "#/components/schemas/Payout" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/quality:
    get:
      operationId: getMyQuality
      summary: The caller's trust score, its inputs and a 30-day trend (`earnings.read_own`).
      description: >-
        As of the start of today in Nairobi (`as_of`): today's work shows tomorrow, like gold
        feedback and gold earnings, so the score never moves straight after a gold task (D-120).
        Weights, floor, window and minimum gold results are the live settings.
      tags: [earnings]
      responses:
        "200":
          description: Quality record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyQuality" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/me/training:
    get:
      operationId: listMyTraining
      summary: Instructions and guidelines of the live projects the caller may work on (`task.submit`).
      description: Empty for a contributor who is not active and verified.
      tags: [tasks]
      responses:
        "200":
          description: Training projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      required: [id, name, task_type, instructions_md, guidelines]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        task_type: { type: string }
                        instructions_md: { type: string }
                        guidelines:
                          type: array
                          items:
                            type: object
                            required: [title, body_md]
                            properties:
                              title: { type: string }
                              body_md: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/quality:
    get:
      operationId: getProjectQuality
      summary: The project's quality picture (`project.manage` or the project's client with `org.project.read`).
      description: >-
        Aggregates only (brief 8.4): items, completed, review rate and reasons, gold accuracy
        over 30 days, contributor count, and the latest agreement figures per statistic and
        label with the brief 8.2 band for kappa. No contributor is named.
      tags: [projects]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Quality, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectQuality" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/quality/snapshot:
    post:
      operationId: snapshotProjectQuality
      summary: Recompute the project's agreement over the last 30 days now (`project.manage`). Runs nightly anyway.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Quality, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectQuality" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/reviewers:
    get:
      operationId: listProjectReviewers
      summary: The project's assigned reviewers and the staff who could be assigned (`project.manage`).
      tags: [review]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Reviewers, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectReviewers" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addProjectReviewer
      summary: Assign a reviewer to the project (`project.manage`). Only staff holding `review.decide` can be assigned.
      tags: [review]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } }
      responses:
        "204": { description: Assigned }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/projects/{id}/reviewers/{userId}:
    delete:
      operationId: removeProjectReviewer
      summary: Remove a reviewer from the project (`project.manage`).
      tags: [review]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/deliverables:
    get:
      operationId: listDeliverables
      summary: The project's deliverable versions, newest first (`deliverable.publish` or `org.deliverable.download`).
      description: A client user sees published versions of its own organisation's projects only (row-level security).
      tags: [delivery]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema: { type: object, required: [versions], properties: { versions: { type: array, items: { $ref: "#/components/schemas/DeliverableVersion" } } } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: exportDeliverable
      summary: Export the project's final items as a new, unpublished version (`deliverable.publish`).
      description: >-
        Writes a JSONL file, a CSV file and the brief 8.5 manifest to object storage. Only final
        regular items are included; gold and rejected items never are. Up to 50,000 items.
      tags: [delivery]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Exported, content: { application/json: { schema: { $ref: "#/components/schemas/DeliverableVersion" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`nothing_to_export`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`too_large`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`storage_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/projects/{id}/deliverables/{version}/publish:
    post:
      operationId: publishDeliverable
      summary: Make a version visible to the project's client (`deliverable.publish`).
      tags: [delivery]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Published, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [published] } } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`already_published`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/deliverables/{id}/links:
    post:
      operationId: createDeliverableLink
      summary: A download link for one file, valid for five minutes and only for the caller (`deliverable.publish` or `org.deliverable.download`).
      tags: [delivery]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [file], properties: { file: { type: string, enum: [data, manifest] } } }
      responses:
        "200": { description: Link, content: { application/json: { schema: { $ref: "#/components/schemas/DeliverableLink" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/deliverables/{id}/download:
    get:
      operationId: downloadDeliverable
      summary: Download a file through a signed link (`deliverable.publish` or `org.deliverable.download`).
      description: >-
        The link must be signed for the signed-in user and unexpired. A data file is checked
        against its stored checksum. Each download is recorded in deliverable_downloads and the
        audit log.
      tags: [delivery]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: file, in: query, required: true, schema: { type: string, enum: [data, manifest] } }
        - { name: expires, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file, as an attachment
          content:
            application/x-ndjson: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
            application/json: { schema: { type: string, format: binary } }
        "403": { description: "`link_expired` (expired, altered or someone else's link)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/progress:
    get:
      operationId: getProjectProgress
      summary: Items by stage, weekly throughput and finishing pace (`project.manage` or `org.project.read`).
      description: >-
        Gold check items are never counted. Throughput is items made final per Nairobi week
        (Monday start) over the last eight weeks. The pace projects a finishing day from the
        last 14 days (A-074). A client reads its own organisation's projects only.
      tags: [portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Progress, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectProgress" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/projects/{id}/workforce:
    get:
      operationId: getProjectWorkforce
      summary: Who works on the project, by per-organisation code only (`project.manage` or `org.project.read`).
      description: >-
        Contributor codes are stable within one organisation and cannot be matched across
        organisations (D-123). No name, contact or profile detail is returned.
      tags: [portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Workforce, content: { application/json: { schema: { $ref: "#/components/schemas/Workforce" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/activity:
    get:
      operationId: listActivity
      summary: An organisation's activity log, newest first (`audit.read` or `org.project.read`).
      description: >-
        A client user reads its own organisation (an `org_id` for another is 404); staff must pass
        `org_id`. Only project, dataset, deliverable, request and team actions are listed, plus
        invoice actions for people who may read invoices (D-124). ELS staff appear as "MezAI team".
      tags: [portal]
      parameters:
        - { name: org_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: before, in: query, required: false, description: The `before` cursor of the previous page., schema: { type: string, format: date-time } }
      responses:
        "200": { description: Activity, content: { application/json: { schema: { $ref: "#/components/schemas/ActivityList" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/team:
    get:
      operationId: listTeam
      summary: People in the organisation and their roles (`user.manage` or `org.user.invite`).
      description: A client admin reads its own organisation; staff pass `org_id`.
      tags: [portal]
      parameters: [{ name: org_id, in: query, required: false, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: object, required: [members], properties: { members: { type: array, items: { $ref: "#/components/schemas/Member" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/invoices:
    get:
      operationId: listInvoices
      summary: Invoices, newest first (`invoice.manage` or `org.invoice.read`).
      description: A client admin sees its own organisation's invoices only (row-level security); staff may filter by `org_id`.
      tags: [portal]
      parameters: [{ name: org_id, in: query, required: false, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema: { type: object, required: [invoices], properties: { invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } } } }
        "422": { $ref: "#/components/responses/Error" }
    post:
      operationId: uploadInvoice
      summary: Upload an invoice PDF issued outside MezAI (`invoice.manage`).
      tags: [portal]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, org_id, number, issued_on, amount_cents]
              properties:
                file: { type: string, format: binary, description: "PDF, up to 5 MB" }
                org_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
                number: { type: string, maxLength: 60 }
                issued_on: { type: string, format: date }
                due_on: { type: string, format: date }
                amount_cents: { type: integer, minimum: 0 }
                currency: { type: string, enum: [KES] }
                description: { type: string, maxLength: 500 }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "409": { description: "`conflict` (the number is already used for this organisation)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { description: "`storage_unavailable`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/invoices/{id}/status:
    post:
      operationId: setInvoiceStatus
      summary: Mark an invoice paid or void (`invoice.manage`).
      description: issued → paid or void; paid → void. A void invoice stays void.
      tags: [portal]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [paid, void] }
                paid_on: { type: string, format: date, description: Required for paid. }
                reason: { type: string, maxLength: 500, description: Required for void; the client sees it. }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/invoices/{id}/download:
    get:
      operationId: downloadInvoice
      summary: Download an invoice PDF (`invoice.manage` or `org.invoice.read`).
      description: Checked against its stored checksum; each download is recorded in the audit log.
      tags: [portal]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The PDF, as an attachment, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/ops/overview:
    get:
      operationId: getOpsOverview
      summary: The Ops home page (`project.manage`).
      description: >-
        Every project that is not closed with its pace against the deadline (A-074), the queues waiting
        for ELS staff, and contributor health. Staff only.
      tags: [portal]
      responses:
        "200": { description: Overview, content: { application/json: { schema: { $ref: "#/components/schemas/OpsOverview" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/review/items:
    get:
      operationId: listReviewQueue
      summary: Items waiting for review, oldest first (`review.read`).
      description: >-
        Reviewers see items from projects Ops assigned them to; people with `review.adjudicate`
        see every project (D-111). Gold items never appear: they are checked automatically.
      tags: [review]
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid } }
        - { name: reason, in: query, schema: { $ref: "#/components/schemas/RouteReason" } }
      responses:
        "200": { description: Queue, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewQueue" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/review/items/{id}:
    get:
      operationId: getReviewItem
      summary: One item with every answer side by side, the consensus and any decision (`review.read`).
      description: Contributors appear by code only. Items on projects the caller may not review are not found.
      tags: [review]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Item, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewItem" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/review/items/{id}/decision:
    post:
      operationId: decideReviewItem
      summary: Decide an item in review (`review.decide`; `write_final` and `reject_item` also need `review.adjudicate`).
      description: >-
        One transaction: the item becomes final (or rejected), every open answer is accepted and earns
        unless listed in `rejections` (the reason is shown to the contributor), agreement with the final
        answer is recorded and trust scores are recalculated. A retry with the same `Idempotency-Key`
        returns the first result and writes nothing; a second decision on a decided item is refused (409 `already_decided`).
        Feedback needs `feedback.write`.
      tags: [review]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_.:-]{8,100}$" } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DecisionInput" } } }
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/DecisionResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/content-reports:
    get:
      operationId: listContentReports
      summary: Content reports, oldest first (`project.manage`). Default status `open`.
      tags: [tasks]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, actioned, dismissed] } }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports: { type: array, items: { $ref: "#/components/schemas/ContentReport" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/content-reports/{id}/resolve:
    post:
      operationId: resolveContentReport
      summary: Dismiss (the item returns to the queue) or withdraw (the item is removed for good, gold retired).
      tags: [tasks]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [dismiss, withdraw] }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "204": { description: Resolved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/contributors:
    get:
      operationId: listContributors
      summary: Contributors, newest first (`contributor.approve` or `contributor.pause`). Phone numbers masked.
      tags: [contributors]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ContributorStatus" } }
        - { name: identity, in: query, description: "Identity status; `pending` is the Ops verification queue", schema: { $ref: "#/components/schemas/IdentityStatus" } }
        - { name: screening, in: query, schema: { $ref: "#/components/schemas/ScreeningStatus" } }
      responses:
        "200":
          description: Contributors
          content:
            application/json:
              schema:
                type: object
                required: [contributors]
                properties:
                  contributors: { type: array, items: { $ref: "#/components/schemas/ContributorSummary" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/contributors/{id}:
    get:
      operationId: getContributor
      summary: A contributor's profile, identity checks, status history and attempts.
      tags: [contributors]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { $ref: "#/components/responses/ContributorDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/contributors/{id}/identity:
    post:
      operationId: decideContributorIdentity
      summary: Verify or reject a contributor's identity (`contributor.approve`, D-078).
      description: >-
        Verifying needs a confirmed M-Pesa number and a National ID number on the profile
        (409 `identity_incomplete`), and a note while there are possible duplicates (recorded
        number clashes or another account with the same name). Rejecting needs a note, which
        the contributor sees. Verifying makes a qualifying contributor with an approved test active.
      tags: [contributors]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [verify, reject] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/ContributorDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/contributors/{id}/mpesa-name-check:
    post:
      operationId: recordMpesaNameCheck
      summary: Record that the name M-Pesa shows for the number matches the profile name (`payout.create`, D-078).
      description: >-
        Done before the first payout. The registered name is not stored. Cleared when the
        contributor changes their number or name. A mismatch is recorded by rejecting the identity.
      tags: [contributors]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ContributorDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/contributors/{id}/cv:
    get:
      operationId: downloadContributorCV
      summary: The applicant's CV, as an attachment (`contributor.approve`).
      tags: [contributors]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "404": { description: "`not_found` or `no_cv`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/contributors/{id}/screening:
    post:
      operationId: decideScreening
      summary: Shortlist, waitlist or decline a complete application (`contributor.approve`, D-100).
      description: >-
        A decline needs a note, which the applicant sees, and deletes any CV at once. Other
        decisions keep a CV for 90 days. Tests open only once shortlisted.
      tags: [contributors]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [shortlist, waitlist, decline] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/ContributorDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/contributors/{id}/interviews:
    post:
      operationId: recordInterview
      summary: Record one structured phone interview for a shortlisted applicant (`contributor.approve`).
      description: >-
        `completed` calls are scored with the fixed rubric: pass needs identity and
        confidentiality confirmed and the scenario and every language at 3 or 4. A pass may
        make the contributor active. A failed interview can be repeated after 30 days
        (409 `interview_too_soon`); a second pass is 409 `already_passed`. No recording is kept.
      tags: [contributors]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [completed, no_answer] }
                identity_confirmed: { type: boolean }
                language_scores: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 4 } }
                scenario_score: { type: integer, minimum: 1, maximum: 4 }
                confidentiality_ok: { type: boolean }
                availability: { type: string, maxLength: 300 }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/ContributorDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/contributors/{id}/status:
    post:
      operationId: setContributorStatus
      summary: Pause, reinstate or remove a contributor (`contributor.pause`).
      description: >-
        Allowed: active → paused, paused → active, any status except removed → removed.
        Anything else is 409 `illegal_transition` (activation comes only from an approved
        attempt). Removing signs the contributor out everywhere. The reason is audited.
      tags: [contributors]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { $ref: "#/components/schemas/ContributorStatus" }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContributorProfile" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/qualification/attempts:
    get:
      operationId: listQualificationAttempts
      summary: Attempts in one status, oldest first (`contributor.approve`). Default `scored` is the Ops queue.
      tags: [qualification]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [scored, approved, rejected] } }
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                type: object
                required: [attempts]
                properties:
                  attempts: { type: array, items: { $ref: "#/components/schemas/AttemptSummary" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/qualification/attempts/{id}:
    get:
      operationId: reviewQualificationAttempt
      summary: An attempt with expected answers and per-question results, for Ops.
      tags: [qualification]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Attempt, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptReview" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/qualification/attempts/{id}/decision:
    post:
      operationId: decideQualificationAttempt
      summary: Approve or reject a scored attempt (`contributor.approve`).
      description: >-
        Only a passed attempt can be approved (409 `not_passed`). A test with a writing sample
        (the core check) needs `writing_rating` 2 or 3 to approve (422 `writing_rating_required`).
        Approving the core check may make a qualifying contributor active (with interview and
        identity). A rejection needs a note, which the contributor sees. A second decision is
        409 `attempt_closed`.
      tags: [qualification]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string, maxLength: 1000 }
                writing_rating: { type: integer, minimum: 1, maximum: 3, description: "1 weak, 2 adequate, 3 strong" }
      responses:
        "200": { description: Decided attempt, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptReview" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/qualification/core-check:
    post:
      operationId: createCoreCheck
      summary: Set up the generalist core check as a draft for review (`gold.manage`, D-100).
      description: >-
        Seven items written for MezAI: six scored automatically (classification, spot the
        error, an attention check, a pairwise comparison) and a writing sample rated by Ops.
        Only one core check may exist outside `retired` (409 `core_check_exists`). Activate it
        with the test status endpoint after reading it.
      tags: [qualification]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "201": { description: Draft test, content: { application/json: { schema: { $ref: "#/components/schemas/QualificationTest" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/qualification/tests:
    get:
      operationId: listQualificationTests
      summary: Every qualification test (`contributor.approve` or `gold.manage`).
      tags: [qualification]
      responses:
        "200":
          description: Tests
          content:
            application/json:
              schema:
                type: object
                required: [tests]
                properties:
                  tests: { type: array, items: { $ref: "#/components/schemas/QualificationTest" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createQualificationTest
      summary: Create a draft test by copying active gold items from a project (`gold.manage`).
      description: >-
        Copies up to `question_count` random active gold items (content, expected answer,
        tolerance) and the project's labels or rubric, then retires those gold items in the
        project, because applicants will have seen them (D-063). `content_shareable` must be
        true: the copied content is shown to people not yet vetted. 409 `no_gold` when the
        project has none left.
      tags: [qualification]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, skill_kind, skill_value, pass_threshold, project_id, question_count, content_shareable]
              properties:
                title: { type: string, maxLength: 200 }
                skill_kind: { type: string, enum: [language, domain, task_type] }
                skill_value: { type: string, description: "BCP 47 code, domain or task type" }
                pass_threshold: { type: number, exclusiveMinimum: 0, maximum: 1 }
                instructions_md: { type: string, maxLength: 20000 }
                project_id: { type: string, format: uuid }
                question_count: { type: integer, minimum: 1, maximum: 50 }
                content_shareable: { type: boolean, const: true }
      responses:
        "201": { description: Draft test, content: { application/json: { schema: { $ref: "#/components/schemas/QualificationTest" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/qualification/tests/{id}/status:
    post:
      operationId: setQualificationTestStatus
      summary: Open (`active`) or close (`retired`) a test (`gold.manage`). Past results are kept.
      tags: [qualification]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, retired] }
      responses:
        "204": { description: Changed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/organisations:
    get:
      operationId: listOrganisations
      summary: Client organisations with project and member counts (`org.manage` or `project.manage`).
      tags: [projects]
      responses:
        "200":
          description: Organisations
          content:
            application/json:
              schema:
                type: object
                required: [organisations]
                properties:
                  organisations: { type: array, items: { $ref: "#/components/schemas/Organisation" } }
    post:
      operationId: createOrganisation
      summary: Create a client organisation (`org.manage`). The slug is derived from the name when left empty.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                slug: { type: string, maxLength: 60, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organisation" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/task-templates:
    get:
      operationId: listTaskTemplates
      summary: The task types and their import columns (`project.manage`, `item.import` or `gold.manage`).
      tags: [projects]
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates: { type: array, items: { $ref: "#/components/schemas/TaskTemplate" } }
  /v1/projects:
    get:
      operationId: listProjects
      summary: Projects the caller may see. Client users see their own organisation's only (RLS).
      tags: [projects]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProjectStatus" } }
        - { name: org_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      summary: Create a draft project (`project.manage`).
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/projects/{id}:
    get:
      operationId: getProject
      summary: One project. The `staff` block (pay, QA checks, gold count, readiness) is for ELS staff only.
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      summary: Edit settings (`project.manage`). Organisation and task type are fixed; labels, rubric and overlap are fixed once the project has gold or has been live.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/projects/{id}/status:
    post:
      operationId: setProjectStatus
      summary: Move a project (`project.manage`). draft → ready needs instructions; ready → live and paused → live also need items, and active gold when the gold rate is above 0.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [ready, draft, publish, pause, resume, close] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`illegal_transition`, or `not_ready` with the missing pieces"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotReady" }
  /v1/projects/{id}/imports:
    get:
      operationId: listImports
      summary: The project's import files (dataset versions). Gold files are hidden from client users.
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Imports
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports: { type: array, items: { $ref: "#/components/schemas/ImportJob" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: checkImport
      summary: Upload and check a CSV or JSONL file (dry run). Items need `item.import`, gold needs `gold.manage`. Nothing is imported until commit.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary, description: ".csv or .jsonl, up to 10 MB and 20,000 rows" }
                kind: { type: string, enum: [items, gold] }
      responses:
        "201":
          description: Checked; `status` is `validated` or `failed`, with row errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/imports/{id}:
    get:
      operationId: getImport
      summary: One import with its row errors (up to 1000).
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/imports/{id}/commit:
    post:
      operationId: commitImport
      summary: Import every row of a checked file in one transaction. The file is re-read, its digest confirmed and checked again; any problem imports nothing.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`import_not_committable`, `import_stale`, `file_changed` or `project_closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/projects/{id}/gold:
    get:
      operationId: listGold
      summary: The project's gold items with expected answers (`gold.manage`).
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Gold
          content:
            application/json:
              schema:
                type: object
                required: [gold]
                properties:
                  gold: { type: array, items: { $ref: "#/components/schemas/GoldItem" } }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGold
      summary: Add one gold item by hand (`gold.manage`), checked like a file row.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, expected]
              properties:
                external_id: { type: string, maxLength: 200 }
                content: { type: object, additionalProperties: { type: string } }
                expected: { $ref: "#/components/schemas/Answer" }
                tolerance: { $ref: "#/components/schemas/Tolerance" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldItem" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/gold/{id}/retire:
    post:
      operationId: retireGold
      summary: Stop serving a gold item (`gold.manage`). Past results stay.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [retired] }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/project-requests:
    get:
      operationId: listProjectRequests
      summary: Project requests. Client users see their own organisation's only (RLS).
      tags: [projects]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, converted, declined] } }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/ProjectRequest" } }
    post:
      operationId: createProjectRequest
      summary: Submit a project request for the caller's organisation (`org.project.request`, client users only). Ops is emailed.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectRequestInput" }
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: ProjectRequestInput as JSON }
                sample: { type: string, format: binary, description: ".csv, .tsv, .jsonl, .json or .txt, up to 5 MB" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/project-requests/{id}:
    get:
      operationId: getProjectRequest
      summary: One project request.
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRequest" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/project-requests/{id}/sample:
    get:
      operationId: downloadProjectRequestSample
      summary: Download the attached sample file (always as an attachment).
      tags: [projects]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /v1/project-requests/{id}/convert:
    post:
      operationId: convertProjectRequest
      summary: Create a draft project from a request (`project.manage`). The project joins the request's organisation.
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
  /v1/project-requests/{id}/decline:
    post:
      operationId: declineProjectRequest
      summary: Decline a request with a note the client sees (`project.manage`).
      tags: [projects]
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRequest" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/InvalidField" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mezai_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrf_token` from login or `/v1/auth/me`. Required on every state-changing request while signed in.
      schema: { type: string }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
  responses:
    ContributorDetail:
      description: Contributor
      content:
        application/json:
          schema:
            type: object
            required: [profile, identity, application, interviews, history, attempts]
            properties:
              profile: { $ref: "#/components/schemas/ContributorProfile" }
              identity: { $ref: "#/components/schemas/IdentityChecks" }
              application: { $ref: "#/components/schemas/Application" }
              interviews: { type: array, items: { $ref: "#/components/schemas/Interview" } }
              history:
                type: array
                items:
                  type: object
                  required: [from, to, reason, changed_by, at]
                  properties:
                    from: { type: [string, "null"] }
                    to: { type: string }
                    reason: { type: string }
                    changed_by: { type: [string, "null"], description: Display name; null for the system }
                    at: { type: string, format: date-time }
              attempts: { type: array, items: { $ref: "#/components/schemas/AttemptSummary" } }
    Accepted:
      description: Accepted. The same answer whether or not the email is registered.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [accepted] }
    WeakPassword:
      description: "`weak_password`, with a `message` safe to show"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  message: { type: string }
    Error:
      description: Error with a stable code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidField:
      description: "`invalid_input` with the first invalid `field` and a `message` safe to show"
      content:
        application/json:
          schema:
            type: object
            required: [error, field, message]
            properties:
              error: { type: string, enum: [invalid_input] }
              field: { type: string }
              message: { type: string }
    TooMany:
      description: Rate limited (`too_many_requests`)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  headers:
    RequestID:
      description: Request ID. A well-formed incoming value (8 to 64 of A-Z a-z 0-9 . _ -) is reused; otherwise one is generated.
      schema:
        type: string
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: One entry per dependency, for example `database` and `storage`.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable machine-readable code, for example `not_found`.
    Me:
      type: object
      required: [user, csrf_token]
      properties:
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` on state-changing requests.
        user:
          type: object
          required: [id, email, display_name, kind, permissions]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            display_name: { type: string }
            kind:
              type: string
              enum: [staff, client, contributor]
            org_id:
              type: string
              format: uuid
              description: Client users only.
            contributor_id:
              type: string
              format: uuid
              description: Contributors only.
            permissions:
              type: array
              items: { type: string }
              description: Permission keys. The UI may hide what a user cannot do; the API always checks.
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        org_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    UserSummary:
      type: object
      required: [id, email, display_name, status, email_verified, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        email_verified: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        roles:
          type: array
          items: { type: string }
          description: "`role_key`, or `role_key:org_id` for client roles"
    Role:
      type: object
      required: [key, name, description, scope, permissions]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        scope: { type: string, enum: [platform, org] }
        permissions: { type: array, items: { type: string } }
    EnquiryRequest:
      type: object
      required: [name, organisation, email, project_type]
      properties:
        name: { type: string, maxLength: 120 }
        organisation: { type: string, maxLength: 200 }
        email: { type: string, format: email, maxLength: 254 }
        project_type: { type: string, enum: [ai-evaluation, african-language-data, data-annotation, expert-review, not-sure] }
        languages: { type: string, maxLength: 200 }
        volume: { type: string, enum: ["", under-1k, 1k-10k, 10k-100k, over-100k, not-sure] }
        timeline: { type: string, enum: ["", 1-month, 1-3-month, later, exploring] }
        message: { type: string, maxLength: 5000 }
        website: { type: string, description: "Honeypot. Leave empty." }
        turnstile_token: { type: string, description: "Cloudflare Turnstile response, when DG-07 is on." }
    PublicStat:
      type: object
      required: [key, label, value, unit, source, verified_at]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit: { type: string }
        source: { type: string, minLength: 1 }
        source_url: { type: [string, "null"] }
        verified_at: { type: string, format: date-time }
    ContributorStatus:
      type: string
      enum: [applied, qualifying, active, paused, removed]
    Language:
      type: object
      required: [language, proficiency, dialects]
      properties:
        language: { type: string, description: "BCP 47, for example sw or sw-KE" }
        proficiency: { type: string, enum: [native, fluent, working] }
        dialects: { type: array, maxItems: 5, items: { type: string, maxLength: 40 } }
    ContributorProfile:
      type: object
      required: [id, public_code, status, email, display_name, country, city, education_level, weekly_hours,
        mpesa_phone_masked, mpesa_phone_confirmed, national_id_last3, identity_status, identity_note,
        experience, linkedin_url, cv_file_name, screening_status, screening_note, interview_passed, trust,
        languages, domains, missing, consents, consent_required, qualifications, created_at]
      properties:
        id: { type: string, format: uuid }
        public_code: { type: string, description: "C-0001; the only identifier clients ever see" }
        status: { $ref: "#/components/schemas/ContributorStatus" }
        email: { type: string }
        display_name: { type: string }
        country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
        city: { type: [string, "null"] }
        education_level: { type: [string, "null"], enum: [secondary, certificate, diploma, bachelor, master, doctorate, other, null] }
        weekly_hours: { type: [integer, "null"] }
        mpesa_phone_masked: { type: string, description: "+254 7•• ••• 678; empty when none. The full number is never returned." }
        mpesa_phone_confirmed: { type: boolean }
        national_id_last3: { type: [string, "null"], description: Last 3 digits; the number itself is never stored }
        identity_status: { $ref: "#/components/schemas/IdentityStatus" }
        identity_note: { type: [string, "null"], description: "Ops' note; the reason when rejected" }
        experience: { $ref: "#/components/schemas/Experience" }
        linkedin_url: { type: [string, "null"] }
        cv_file_name: { type: [string, "null"], description: Null when no CV is on file }
        screening_status: { $ref: "#/components/schemas/ScreeningStatus" }
        screening_note: { type: [string, "null"], description: The reason for a waitlist or decline }
        interview_passed: { type: boolean }
        trust:
          type: [object, "null"]
          description: >-
            Ops only (null for the contributor, who reads /v1/me/quality; D-120). Latest trust score (brief 8.4): 0.5 × gold accuracy + 0.3 × agreement with the final
            answer + 0.2 × review acceptance over 30 days; inputs without data are left out and
            the weights rescaled (D-106). While building (fewer gold results than the minimum) it
            never pauses anyone. Null until the first gold result or agreement.
          required: [score, gold_accuracy, agreement, review_acceptance, gold_results, min_gold_results, building, updated_at]
          properties:
            score: { type: [number, "null"] }
            gold_accuracy: { type: [number, "null"] }
            agreement: { type: [number, "null"] }
            review_acceptance: { type: [number, "null"] }
            gold_results: { type: integer }
            min_gold_results: { type: integer }
            building: { type: boolean }
            updated_at: { type: string, format: date-time }
        languages: { type: array, items: { $ref: "#/components/schemas/Language" } }
        domains: { type: array, items: { type: string, enum: [health, law, finance, education, software, agriculture, other] } }
        missing: { type: array, items: { type: string }, description: Fields still needed before the contributor can qualify }
        consents:
          type: array
          items:
            type: object
            required: [document, version, accepted_at]
            properties:
              document: { type: string }
              version: { type: string }
              accepted_at: { type: string, format: date-time }
        consent_required: { type: array, items: { type: string }, description: Documents whose current version is not yet accepted }
        qualifications:
          type: array
          items:
            type: object
            required: [test_id, title, skill_kind, skill_value, approved_at, valid_until]
            properties:
              test_id: { type: string, format: uuid }
              title: { type: string }
              skill_kind: { type: string }
              skill_value: { type: string }
              approved_at: { type: string, format: date-time }
              valid_until: { type: [string, "null"], format: date-time, description: Skills count for 12 months; null for the core check }
        created_at: { type: string, format: date-time }
    ContributorProfileInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        country: { type: [string, "null"] }
        city: { type: [string, "null"], maxLength: 100 }
        education_level: { type: [string, "null"] }
        weekly_hours: { type: [integer, "null"], minimum: 0, maximum: 80 }
        languages: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Language" } }
        domains: { type: array, items: { type: string } }
        mpesa_phone: { type: string, description: "07XXXXXXXX, 01XXXXXXXX, 254… or +254…" }
        mpesa_phone_confirm: { type: string, description: Must match mpesa_phone }
        national_id:
          type: string
          description: >-
            Kenyan National ID number, 6 to 9 digits. Empty keeps the stored one. Stored only as a
            keyed fingerprint and its last 3 digits. A number on another account is 422 for this field.
        experience: { $ref: "#/components/schemas/Experience" }
        linkedin_url: { type: [string, "null"], description: "https://www.linkedin.com/in/…" }
    IdentityStatus: { type: string, enum: [pending, verified, rejected] }
    ScreeningStatus: { type: string, enum: [pending, shortlisted, waitlisted, declined] }
    Experience:
      type: object
      description: The short application form (D-100). highest_study, relevant_experience and why are required for a complete application.
      properties:
        highest_study: { type: string, maxLength: 200 }
        relevant_experience: { type: string, maxLength: 1000 }
        ai_data_experience: { type: string, maxLength: 500 }
        why: { type: string, maxLength: 800 }
    Application:
      type: object
      required: [experience, linkedin_url, cv_file_name, cv_uploaded_at, cv_delete_after, screening_status, screening_note, screening_decided_at]
      properties:
        experience: { $ref: "#/components/schemas/Experience" }
        linkedin_url: { type: [string, "null"] }
        cv_file_name: { type: [string, "null"] }
        cv_uploaded_at: { type: [string, "null"], format: date-time }
        cv_delete_after: { type: [string, "null"], format: date-time }
        screening_status: { $ref: "#/components/schemas/ScreeningStatus" }
        screening_note: { type: [string, "null"] }
        screening_decided_at: { type: [string, "null"], format: date-time }
    Interview:
      type: object
      required: [id, outcome, identity_confirmed, language_scores, scenario_score, confidentiality_ok, availability, note, interviewer, at]
      properties:
        id: { type: string, format: uuid }
        outcome: { type: string, enum: [passed, failed, no_answer] }
        identity_confirmed: { type: boolean }
        language_scores: { type: object, additionalProperties: { type: integer } }
        scenario_score: { type: [integer, "null"] }
        confidentiality_ok: { type: [boolean, "null"] }
        availability: { type: [string, "null"] }
        note: { type: [string, "null"] }
        interviewer: { type: string }
        at: { type: string, format: date-time }
    ContributorRef:
      type: object
      required: [id, public_code, status]
      properties:
        id: { type: string, format: uuid }
        public_code: { type: string }
        status: { $ref: "#/components/schemas/ContributorStatus" }
    IdentityChecks:
      type: object
      description: What Ops sees when verifying a contributor (D-078). Other accounts are named by code only.
      required: [status, note, decided_by, decided_at, national_id_last3, mpesa_name_checked_at, mpesa_name_checked_by, flags, same_name]
      properties:
        status: { $ref: "#/components/schemas/IdentityStatus" }
        note: { type: [string, "null"] }
        decided_by: { type: [string, "null"], description: Display name }
        decided_at: { type: [string, "null"], format: date-time }
        national_id_last3: { type: [string, "null"] }
        mpesa_name_checked_at: { type: [string, "null"], format: date-time }
        mpesa_name_checked_by: { type: [string, "null"], description: Display name }
        flags:
          type: array
          description: Tries to put a number on a profile while another account held it
          items:
            type: object
            required: [kind, raised_by_this, other, at]
            properties:
              kind: { type: string, enum: [mpesa_in_use, national_id_in_use] }
              raised_by_this: { type: boolean, description: "True: this contributor tried to use the other account's number" }
              other: { $ref: "#/components/schemas/ContributorRef" }
              at: { type: string, format: date-time }
        same_name: { type: array, items: { $ref: "#/components/schemas/ContributorRef" }, description: Other accounts with the same name }
    EarningsSummary:
      type: object
      required: [totals, tasks, next_payout_date, min_payout_cents, payout_schedule]
      properties:
        totals:
          type: array
          items:
            type: object
            required: [currency, pending_cents, pending_tasks, approved_cents, paid_cents, earned_cents]
            properties:
              currency: { type: string }
              pending_cents: { type: integer, format: int64 }
              pending_tasks: { type: integer }
              approved_cents: { type: integer, format: int64 }
              paid_cents: { type: integer, format: int64 }
              earned_cents: { type: integer, format: int64 }
        tasks:
          type: object
          required: [submitted, waiting, accepted, not_accepted]
          properties:
            submitted: { type: integer }
            waiting: { type: integer }
            accepted: { type: integer }
            not_accepted: { type: integer }
        next_payout_date: { type: [string, "null"], format: date }
        min_payout_cents: { type: integer, format: int64 }
        payout_schedule: { type: string }
    Statement:
      type: object
      required: [lines, before]
      properties:
        lines:
          type: array
          items:
            type: object
            required: [day, type, currency, project_id, project_name, tasks, amount_cents, reason, mpesa_receipt]
            properties:
              day: { type: string, format: date }
              type: { type: string, enum: [accrual, payout, payout_reversal, adjustment] }
              currency: { type: string }
              project_id: { type: [string, "null"], format: uuid }
              project_name: { type: [string, "null"] }
              tasks: { type: integer, description: Accepted answers on an accrual line; 0 otherwise }
              amount_cents: { type: integer, format: int64, description: Signed; payouts are negative }
              reason: { type: [string, "null"] }
              mpesa_receipt: { type: [string, "null"] }
        before: { type: [string, "null"], format: date, description: Cursor for the next older page }
    Payout:
      type: object
      required: [id, period_start, period_end, amount_cents, currency, status, mpesa_receipt, failure_reason, phone_masked, recorded_at, created_at]
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [processing, paid, failed] }
        mpesa_receipt: { type: [string, "null"] }
        failure_reason: { type: [string, "null"] }
        phone_masked: { type: string }
        recorded_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    MyQuality:
      type: object
      required: [as_of, trust, trend, weights, floor, window_days, min_gold_results]
      properties:
        as_of: { type: string, format: date-time }
        trust:
          type: [object, "null"]
          required: [score, gold_accuracy, agreement, review_acceptance, building, calculated_at]
          properties:
            score: { type: [number, "null"] }
            gold_accuracy: { type: [number, "null"] }
            agreement: { type: [number, "null"] }
            review_acceptance: { type: [number, "null"] }
            building: { type: boolean }
            calculated_at: { type: string, format: date-time }
        trend:
          type: array
          items:
            type: object
            required: [day, score, gold_accuracy]
            properties:
              day: { type: string, format: date }
              score: { type: [number, "null"] }
              gold_accuracy: { type: [number, "null"] }
        weights:
          type: object
          required: [gold_accuracy, agreement, review_acceptance]
          properties:
            gold_accuracy: { type: number }
            agreement: { type: number }
            review_acceptance: { type: number }
        floor: { type: number }
        window_days: { type: integer }
        min_gold_results: { type: integer }
    WorkProject:
      type: object
      description: A live project as a contributor sees it. No gold, overlap or other contributors.
      required: [id, name, task_type, instructions_md, config, pay_per_task_cents, currency, deadline,
        reservation_minutes, skills, qa_checks, min_rationale_chars, my_submitted]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        task_type: { type: string, enum: [classification, pairwise, translation_review] }
        instructions_md: { type: string }
        config: { $ref: "#/components/schemas/TaskConfig" }
        pay_per_task_cents: { type: integer, format: int64 }
        currency: { type: string }
        deadline: { type: [string, "null"], format: date-time }
        reservation_minutes: { type: integer }
        skills:
          type: array
          items:
            type: object
            required: [kind, value, min_proficiency]
            properties:
              kind: { type: string }
              value: { type: string }
              min_proficiency: { type: [string, "null"] }
        qa_checks: { $ref: "#/components/schemas/QAChecks" }
        min_rationale_chars: { type: integer }
        my_submitted: { type: integer }
        tasks_left:
          type: integer
          description: >-
            List only. About how many more tasks the caller could get: regular items short of k
            answers that they have not seen. Gold checks come on top and are never counted apart.
        minutes_per_task:
          type: number
          description: List only. Median time on task over the last 30 days, rounded up to the half minute; absent below 10 answers.
    Task:
      type: object
      description: One reserved item. The ID is the assignment's; gold and other items look the same.
      required: [id, project_id, task_type, status, expires_at, content, draft, time_on_task_ms]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        task_type: { type: string, enum: [classification, pairwise, translation_review] }
        status: { type: string, enum: [reserved, submitted, skipped, expired, reported] }
        expires_at: { type: string, format: date-time }
        content:
          type: [object, "null"]
          additionalProperties: { type: string }
          description: Item fields for the task type; null once the reservation has ended
        draft: { oneOf: [{ $ref: "#/components/schemas/Answer" }, { type: "null" }] }
        time_on_task_ms: { type: integer, format: int64 }
    QAIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [rationale_too_short, translation_unchanged, rationale_mismatch, too_fast, mostly_pasted] }
        field: { type: string }
        message: { type: string }
    ProjectQuality:
      type: object
      required: [items, completed, routed_to_review, review_rate, route_reasons, gold_accuracy, gold_results, contributors, agreement]
      properties:
        items: { type: integer, description: Regular items (gold excluded) }
        completed: { type: integer, description: Items that reached k answers }
        routed_to_review: { type: integer }
        review_rate: { type: [number, "null"] }
        route_reasons: { type: object, additionalProperties: { type: integer } }
        gold_accuracy: { type: [number, "null"], description: Last 30 days, all contributors }
        gold_results: { type: integer }
        contributors: { type: integer }
        agreement:
          type: array
          items:
            type: object
            required: [label, statistic, value, band, items, raters, window_end]
            properties:
              label: { type: [string, "null"], description: Null for the whole project }
              statistic: { type: string, enum: [percent, cohen_kappa, fleiss_kappa, mean_abs_diff] }
              value: { type: number }
              band: { type: [string, "null"], enum: [weak, moderate, substantial, strong, null] }
              items: { type: integer }
              raters: { type: integer }
              window_end: { type: string, format: date-time }
    RouteReason: { type: string, enum: [no_majority, spread, flagged, audit_sample] }
    Reviewer:
      type: object
      required: [id, display_name, email]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string }
    ProjectReviewers:
      type: object
      required: [assigned, candidates]
      properties:
        assigned: { type: array, items: { $ref: "#/components/schemas/Reviewer" } }
        candidates: { type: array, items: { $ref: "#/components/schemas/Reviewer" } }
    ReviewQueue:
      type: object
      required: [items, projects]
      properties:
        items:
          type: array
          items:
            type: object
            required: [item_id, external_id, project_id, project_name, org_name, task_type, reason, agreement, spread, submissions, waiting_since]
            properties:
              item_id: { type: string, format: uuid }
              external_id: { type: [string, "null"] }
              project_id: { type: string, format: uuid }
              project_name: { type: string }
              org_name: { type: string }
              task_type: { type: string }
              reason: { $ref: "#/components/schemas/RouteReason" }
              agreement: { type: [number, "null"] }
              spread: { type: [number, "null"] }
              submissions: { type: integer }
              waiting_since: { type: string, format: date-time }
        projects:
          type: array
          items:
            type: object
            required: [id, name, waiting]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              waiting: { type: integer }
    ReviewItem:
      type: object
      required: [id, external_id, status, project_id, project_name, task_type, config, instructions_md, content, consensus, submissions, decision, can_adjudicate]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: [string, "null"] }
        status: { type: string }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        task_type: { type: string }
        config: { type: object, additionalProperties: true }
        instructions_md: { type: string }
        content: { type: object, additionalProperties: true }
        can_adjudicate: { type: boolean }
        consensus:
          oneOf:
            - { type: "null" }
            - type: object
              required: [method, result, complete, agreement, spread, reason]
              properties:
                method: { type: string, enum: [majority, mean] }
                result: { type: object, additionalProperties: true }
                complete: { type: boolean, description: There is a consensus answer to accept }
                agreement: { type: [number, "null"] }
                spread: { type: [number, "null"] }
                reason: { oneOf: [{ $ref: "#/components/schemas/RouteReason" }, { type: "null" }] }
        submissions:
          type: array
          items:
            type: object
            required: [id, contributor, status, submitted_at, time_on_task_ms, answer, warnings, rejection_reason, agrees_with_final]
            properties:
              id: { type: string, format: uuid }
              contributor: { type: string, description: Contributor code }
              status: { type: string, enum: [submitted, accepted, rejected] }
              submitted_at: { type: [string, "null"], format: date-time }
              time_on_task_ms: { type: integer }
              answer: { type: object, additionalProperties: true }
              warnings: { type: array, items: { $ref: "#/components/schemas/QAIssue" } }
              rejection_reason: { type: [string, "null"] }
              agrees_with_final: { type: [boolean, "null"] }
        decision:
          oneOf:
            - { type: "null" }
            - type: object
              required: [id, decision, chosen_submission_id, final_answer, reason, reviewer, created_at]
              properties:
                id: { type: string, format: uuid }
                decision: { $ref: "#/components/schemas/ReviewDecisionKind" }
                chosen_submission_id: { type: [string, "null"], format: uuid }
                final_answer: { oneOf: [{ type: object, additionalProperties: true }, { type: "null" }] }
                reason: { type: [string, "null"] }
                reviewer: { type: string }
                created_at: { type: string, format: date-time }
    ReviewDecisionKind: { type: string, enum: [accept_consensus, choose_submission, write_final, reject_item] }
    SubmissionNote:
      type: object
      required: [submission_id, text]
      properties:
        submission_id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 1000 }
    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/ReviewDecisionKind" }
        submission_id: { type: [string, "null"], format: uuid, description: Required for choose_submission }
        final_answer: { type: object, additionalProperties: true, description: Required for write_final; validated like a submission }
        reason: { type: string, maxLength: 1000, description: Required (10 or more characters) for reject_item }
        rejections:
          type: array
          description: Answers that will not be accepted (no earning); the reason (10 or more characters) is shown to the contributor
          items: { $ref: "#/components/schemas/SubmissionNote" }
        feedback: { type: array, description: Notes to contributors (`feedback.write`), items: { $ref: "#/components/schemas/SubmissionNote" } }
    DecisionResult:
      type: object
      required: [review_id, decision, item_status]
      properties:
        review_id: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/ReviewDecisionKind" }
        item_status: { type: string, enum: [final, rejected] }
    DeliverableFile:
      type: object
      required: [id, file, format, name, bytes, sha256, downloads]
      properties:
        id: { type: string, format: uuid, description: "The deliverable row; the manifest is offered through the JSONL row." }
        file: { type: string, enum: [data, manifest] }
        format: { type: string, enum: [jsonl, csv, json] }
        name: { type: string }
        bytes: { type: integer, description: "0 for the manifest" }
        sha256: { type: string, description: "Empty for the manifest, which holds the data files' checksums" }
        downloads: { type: integer }
    DeliverableManifest:
      type: object
      description: Brief 8.5. Contributors appear by public code only; no item content.
      required: [schema, schema_version, project, version, exported_at, items, gold_accuracy, agreement, review, contributors, files, notes]
      properties:
        schema: { type: string, enum: [mezai.delivery-manifest] }
        schema_version: { type: integer }
        project:
          type: object
          required: [id, name, task_type, organisation, overlap_k]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            task_type: { type: string }
            organisation: { type: string }
            overlap_k: { type: integer }
        version: { type: integer }
        exported_at: { type: string, format: date-time }
        items:
          type: object
          required: [total, delivered, consensus, adjudicated, rejected, not_final, complete]
          properties:
            total: { type: integer }
            delivered: { type: integer }
            consensus: { type: integer }
            adjudicated: { type: integer }
            rejected: { type: integer }
            not_final: { type: integer }
            complete: { type: boolean }
        gold_accuracy:
          type: object
          required: [results, correct, accuracy, distribution, by_contributor]
          properties:
            results: { type: integer }
            correct: { type: integer }
            accuracy: { type: [number, "null"] }
            distribution:
              type: object
              required: [contributors, min, median, max]
              properties:
                contributors: { type: integer }
                min: { type: [number, "null"] }
                median: { type: [number, "null"] }
                max: { type: [number, "null"] }
            by_contributor:
              type: array
              items:
                type: object
                required: [contributor, results, accuracy]
                properties:
                  contributor: { type: string }
                  results: { type: integer }
                  accuracy: { type: [number, "null"] }
        agreement:
          type: array
          items:
            type: object
            required: [statistic, label, value, band, items, raters]
            properties:
              statistic: { type: string, enum: [percent, cohen_kappa, fleiss_kappa, mean_abs_diff] }
              label: { type: [string, "null"] }
              value: { type: number }
              band: { type: [string, "null"], enum: [weak, moderate, substantial, strong, null] }
              items: { type: integer }
              raters: { type: integer }
        review:
          type: object
          required: [completed, routed, review_rate, reasons]
          properties:
            completed: { type: integer }
            routed: { type: integer }
            review_rate: { type: [number, "null"] }
            reasons: { type: object, additionalProperties: { type: integer } }
        contributors:
          type: object
          required: [count, ids]
          properties:
            count: { type: integer }
            ids: { type: array, items: { type: string } }
        files:
          type: array
          items:
            type: object
            required: [name, format, records, bytes, sha256]
            properties:
              name: { type: string }
              format: { type: string, enum: [jsonl, csv] }
              records: { type: integer }
              bytes: { type: integer }
              sha256: { type: string }
        notes: { type: array, items: { type: string } }
    DeliverableVersion:
      type: object
      required: [version, items, created_at, published_at, manifest, files]
      properties:
        version: { type: integer }
        items: { type: integer }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        manifest: { $ref: "#/components/schemas/DeliverableManifest" }
        files: { type: array, items: { $ref: "#/components/schemas/DeliverableFile" } }
    DeliverableLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: "A path on the frontend origin (/api/v1/...)." }
        expires_at: { type: string, format: date-time }
    ContentReport:
      type: object
      required: [id, category, note, status, created_at, resolved_at, item_id, external_id, project_id, project_name, reported_by]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [harmful, personal_data, broken, other] }
        note: { type: [string, "null"] }
        status: { type: string, enum: [open, actioned, dismissed] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        item_id: { type: string, format: uuid }
        external_id: { type: [string, "null"] }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        reported_by: { type: string, description: Contributor code }
    ContributorSummary:
      type: object
      required: [id, public_code, status, display_name, email, country, languages, mpesa_phone_masked,
        identity_status, national_id_last3, possible_duplicates, screening_status, interview_passed, qualified, created_at]
      properties:
        id: { type: string, format: uuid }
        public_code: { type: string }
        status: { $ref: "#/components/schemas/ContributorStatus" }
        display_name: { type: string }
        email: { type: string }
        country: { type: [string, "null"] }
        languages: { type: array, items: { type: string } }
        mpesa_phone_masked: { type: string }
        identity_status: { $ref: "#/components/schemas/IdentityStatus" }
        national_id_last3: { type: [string, "null"] }
        possible_duplicates: { type: integer, description: Recorded number clashes plus other accounts with the same name }
        screening_status: { $ref: "#/components/schemas/ScreeningStatus" }
        interview_passed: { type: boolean }
        qualified: { type: boolean, description: Holds an approved qualification test }
        created_at: { type: string, format: date-time }
    TaskConfig:
      type: object
      description: Labels for classification, rubric criteria (scored 1 to 5) for pairwise.
      properties:
        labels: { type: array, items: { type: string } }
        multi_label: { type: boolean }
        criteria: { type: array, items: { type: string } }
    Answer:
      type: object
      description: >-
        Shape of the task template's submission schema. Classification: `labels` (optional
        `confidence` 1 to 5, `note`). Pairwise: `preference` (a, b, tie), `scores_a` and
        `scores_b` per criterion 1 to 5, `rationale`. Translation review: `adequacy` and
        `fluency` 1 to 5, `corrected`, optional `error_tags`. Writing sample (core check): `text`,
        60 to 250 words.
      additionalProperties: true
    AnswersRequest:
      type: object
      properties:
        answers:
          type: object
          description: Question ID → answer
          additionalProperties: { $ref: "#/components/schemas/Answer" }
    MyQualificationTest:
      type: object
      required: [id, title, skill_kind, skill_value, task_type, pass_threshold, instructions_md, question_count,
        state, valid_until, core_first, attempt_id, score, decision_note, retake_after, can_start]
