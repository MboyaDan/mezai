        task_type: { type: string, enum: [classification, pairwise, translation_review] }
        pass_threshold: { type: number }
        instructions_md: { type: string }
        question_count: { type: integer }
        state:
          type: string
          enum: [available, in_progress, awaiting_review, qualified, not_passed, expired]
          description: "`expired`: a skill older than 12 months; it can be taken again. The core check never expires."
        valid_until: { type: [string, "null"], format: date-time }
        core_first: { type: boolean, description: A skill test locked until the core check is approved }
        attempt_id: { type: [string, "null"], format: uuid }
        score: { type: [number, "null"] }
        decision_note: { type: [string, "null"] }
        retake_after: { type: [string, "null"], format: date-time }
        can_start: { type: boolean }
    QualificationAttempt:
      type: object
      required: [id, status, test_id, title, task_type, config, instructions_md, pass_threshold, questions, answers,
        score, passed, started_at, submitted_at, decision_note, decided_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [in_progress, scored, approved, rejected] }
        test_id: { type: string, format: uuid }
        title: { type: string }
        task_type: { type: string, enum: [classification, pairwise, translation_review] }
        config: { $ref: "#/components/schemas/TaskConfig" }
        instructions_md: { type: string }
        pass_threshold: { type: number }
        questions:
          type: array
          items:
            type: object
            required: [id, position, content, task_type, config]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              content: { type: object, description: Item content in the task template's import shape }
              task_type: { type: string, enum: [classification, pairwise, translation_review, writing], description: "The question's own type (the core check mixes them)" }
              config: { $ref: "#/components/schemas/TaskConfig" }
        answers: { type: object, additionalProperties: { $ref: "#/components/schemas/Answer" } }
        score: { type: [number, "null"], description: "Share correct, after submission" }
        passed: { type: [boolean, "null"] }
        started_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        decision_note: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
    AttemptSummary:
      type: object
      required: [id, status, score, passed, submitted_at, decided_at, decision_note, test_id, test_title, pass_threshold,
        skill_kind, skill_value, contributor_id, public_code, contributor_status, display_name]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        score: { type: [number, "null"] }
        passed: { type: [boolean, "null"] }
        submitted_at: { type: [string, "null"], format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: [string, "null"] }
        test_id: { type: string, format: uuid }
        test_title: { type: string }
        pass_threshold: { type: number }
        skill_kind: { type: string }
        skill_value: { type: string }
        contributor_id: { type: string, format: uuid }
        public_code: { type: string }
        contributor_status: { $ref: "#/components/schemas/ContributorStatus" }
        display_name: { type: string }
    AttemptReview:
      type: object
      required: [id, status, score, passed, submitted_at, decided_at, decision_note, test_id, test_title, task_type,
        config, pass_threshold, contributor, questions, skill_kind, has_writing, writing_rating]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        score: { type: [number, "null"] }
        passed: { type: [boolean, "null"] }
        submitted_at: { type: [string, "null"], format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: [string, "null"] }
        test_id: { type: string, format: uuid }
        test_title: { type: string }
        task_type: { type: string }
        config: { $ref: "#/components/schemas/TaskConfig" }
        pass_threshold: { type: number }
        contributor: { $ref: "#/components/schemas/ContributorSummary" }
        questions:
          type: array
          items:
            type: object
            required: [id, position, content, expected, answer, correct, task_type, config]
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              content: { type: object }
              expected: { $ref: "#/components/schemas/Answer" }
              answer: { oneOf: [{ $ref: "#/components/schemas/Answer" }, { type: "null" }] }
              correct: { type: [boolean, "null"], description: Null for a writing sample (rated by Ops) }
              task_type: { type: string }
              config: { $ref: "#/components/schemas/TaskConfig" }
        skill_kind: { type: string }
        has_writing: { type: boolean, description: Approving needs writing_rating 2 or 3 }
        writing_rating: { type: [integer, "null"] }
    QualificationTest:
      type: object
      required: [id, title, skill_kind, skill_value, task_type, pass_threshold, instructions_md, status, config,
        source_project_id, question_count, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        skill_kind: { type: string }
        skill_value: { type: string }
        task_type: { type: string }
        pass_threshold: { type: number }
        instructions_md: { type: string }
        status: { type: string, enum: [draft, active, retired] }
        config: { $ref: "#/components/schemas/TaskConfig" }
        source_project_id: { type: [string, "null"], format: uuid }
        question_count: { type: integer }
        created_at: { type: string, format: date-time }
    Organisation:
      type: object
      required: [id, name, slug, status, project_count, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, archived] }
        project_count: { type: integer }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
    TaskType:
      type: string
      enum: [classification, pairwise, translation_review]
    TaskTemplate:
      type: object
      required: [task_type, name, version, content_fields, item_columns, gold_columns]
      properties:
        task_type: { $ref: "#/components/schemas/TaskType" }
        name: { type: string }
        version: { type: integer }
        content_fields: { type: array, items: { type: string } }
        item_columns: { type: array, items: { type: string } }
        gold_columns: { type: array, items: { type: string } }
    ProjectStatus:
      type: string
      enum: [draft, ready, live, paused, closed]
    ProjectConfig:
      type: object
      description: "classification: labels (2 to 50), multi_label. pairwise: criteria (1 to 8 keys), scale [1, 5]. translation_review: error_tags (optional)."
      properties:
        labels: { type: array, items: { type: string } }
        multi_label: { type: boolean }
        criteria: { type: array, items: { type: string } }
        scale: { type: array, items: { type: integer } }
        error_tags: { type: array, items: { type: string } }
    QAChecks:
      type: object
      description: Checks the task screen runs before a contributor submits (Stage 9). Blocking checks stop the submission; warnings are stored with it for reviewers.
      required: [block_unchanged_translation, warn_fast_seconds, warn_rationale_mismatch, warn_pasted]
      properties:
        block_unchanged_translation: { type: boolean, description: Translation review only }
        warn_fast_seconds: { type: integer, minimum: 0, maximum: 600, description: 0 turns it off }
        warn_rationale_mismatch: { type: boolean, description: Pairwise only }
        warn_pasted: { type: boolean }
    ProjectSkill:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [language, domain, task_type] }
        value: { type: string }
        min_proficiency: { type: string, enum: [native, fluent, working] }
    ProjectInput:
      type: object
      required: [name, overlap_k, gold_rate, pay_per_task_cents]
      properties:
        org_id: { type: string, format: uuid, description: Required on create; fixed afterwards }
        task_type: { $ref: "#/components/schemas/TaskType" }
        name: { type: string, maxLength: 200 }
        instructions_md: { type: string, maxLength: 50000 }
        config: { $ref: "#/components/schemas/ProjectConfig" }
        qa_checks: { $ref: "#/components/schemas/QAChecks" }
        overlap_k: { type: integer, minimum: 1, maximum: 5 }
        gold_rate: { type: number, minimum: 0, maximum: 0.5 }
        pay_per_task_cents: { type: integer, format: int64, minimum: 0, description: KES cents per approved task }
        target_count: { type: [integer, "null"], minimum: 1 }
        deadline: { type: [string, "null"], format: date }
        min_rationale_chars: { type: integer, minimum: 0, maximum: 2000, description: Pairwise only }
        skills: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ProjectSkill" } }
    ProjectStaff:
      type: object
      required: [pay_per_task_cents, currency, qa_checks, min_rationale_chars, gold_count, missing, config_locked]
      properties:
        pay_per_task_cents: { type: integer, format: int64 }
        currency: { type: string }
        qa_checks: { $ref: "#/components/schemas/QAChecks" }
        min_rationale_chars: { type: integer }
        gold_count: { type: integer, description: Active gold items }
        missing: { type: array, items: { type: string, enum: [instructions, items, gold] }, description: What stops the next step }
        config_locked: { type: boolean }
    Project:
      type: object
      required: [id, org_id, org_name, task_type, name, status, instructions_md, config, overlap_k, gold_rate, target_count, deadline, item_count, skills, published_at, closed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        task_type: { $ref: "#/components/schemas/TaskType" }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        instructions_md: { type: string }
        config: { $ref: "#/components/schemas/ProjectConfig" }
        overlap_k: { type: integer }
        gold_rate: { type: number }
        target_count: { type: [integer, "null"] }
        deadline: { type: [string, "null"], format: date }
        item_count: { type: integer, description: Work items (excluding gold for staff) }
        skills: { type: array, items: { $ref: "#/components/schemas/ProjectSkill" } }
        published_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        staff: { $ref: "#/components/schemas/ProjectStaff" }
    NotReady:
      type: object
      required: [error]
      properties:
        error: { type: string }
        missing: { type: array, items: { type: string } }
    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: "CSV: file row, header is row 1. JSONL: line." }
        field: { type: string }
        message: { type: string }
    ImportJob:
      type: object
      required: [id, project_id, kind, format, file_name, size_bytes, status, total_rows, valid_rows, error_rows, errors_truncated, created_at, committed_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string, enum: [items, gold] }
        format: { type: string, enum: [csv, jsonl] }
        file_name: { type: string }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [validated, failed, committed] }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        error_rows: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/ImportRowError" } }
        errors_truncated: { type: boolean }
        created_at: { type: string, format: date-time }
        committed_at: { type: [string, "null"], format: date-time }
    Tolerance:
      type: object
      properties:
        adequacy: { type: integer, minimum: 0, maximum: 4 }
        fluency: { type: integer, minimum: 0, maximum: 4 }
    GoldItem:
      type: object
      required: [id, item_id, external_id, content, expected, tolerance, status, usage_count, created_at, retired_at]
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        external_id: { type: [string, "null"] }
        content: { type: object, additionalProperties: { type: string } }
        expected: { $ref: "#/components/schemas/Answer" }
        tolerance: { $ref: "#/components/schemas/Tolerance" }
        status: { type: string, enum: [active, retired] }
        usage_count: { type: integer }
        created_at: { type: string, format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
    ProjectRequestInput:
      type: object
      required: [title, task_type, brief_md, contact_name, contact_email]
      properties:
        title: { type: string, maxLength: 200 }
        task_type: { type: string, enum: [classification, pairwise, translation_review, other] }
        brief_md: { type: string, maxLength: 20000 }
        languages: { type: array, maxItems: 20, items: { type: string } }
        volume_estimate: { type: [integer, "null"], minimum: 1 }
        wanted_by: { type: [string, "null"], format: date }
        contact_name: { type: string, maxLength: 200 }
        contact_email: { type: string, format: email }
    ProjectRequest:
      type: object
      required: [id, org_id, org_name, title, task_type, brief_md, languages, volume_estimate, wanted_by, contact_name, contact_email, sample_file_name, sample_size, status, decision_note, project_id, decided_at, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        title: { type: string }
        task_type: { type: string, enum: [classification, pairwise, translation_review, other] }
        brief_md: { type: string }
        languages: { type: array, items: { type: string } }
        volume_estimate: { type: [integer, "null"] }
        wanted_by: { type: [string, "null"], format: date }
        contact_name: { type: string }
        contact_email: { type: string }
        sample_file_name: { type: [string, "null"] }
        sample_size: { type: [integer, "null"], format: int64 }
        status: { type: string, enum: [submitted, converted, declined] }
        decision_note: { type: [string, "null"] }
        project_id: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ProjectProgress:
      type: object
      required: [project_id, total, not_started, in_progress, in_review, final, rejected, target, deadline, throughput, pace]
      properties:
        project_id: { type: string, format: uuid }
        total: { type: integer, description: Items imported, without gold checks. }
        not_started: { type: integer }
        in_progress: { type: integer, description: Being answered or waiting for enough answers. }
        in_review: { type: integer }
        final: { type: integer }
        rejected: { type: integer }
        target: { type: [integer, "null"] }
        deadline: { type: [string, "null"], format: date }
        throughput:
          type: array
          items:
            type: object
            required: [week, final]
            properties:
              week: { type: string, format: date, description: The Monday of the Nairobi week. }
              final: { type: integer }
        pace: { $ref: "#/components/schemas/Pace" }
    Pace:
      type: object
      description: The finishing pace (A-074).
      required: [goal, remaining, per_day, projected_finish, state]
      properties:
        goal: { type: integer, description: The target when set, otherwise every item imported. }
        remaining: { type: integer }
        per_day: { type: number, description: Items made final per day over the last 14 days. }
        projected_finish: { type: [string, "null"], format: date }
        state: { type: string, enum: [done, on_track, at_risk, no_pace, no_deadline] }
    OpsOverview:
      type: object
      required: [generated_at, queues, projects, contributors]
      properties:
        generated_at: { type: string, format: date-time }
        queues:
          type: object
          description: Counts waiting for ELS staff; each matches the list it links to.
          required: [review, oldest_review_at, reports, attempts, applications, interviews, identity_checks, project_requests]
          properties:
            review: { type: integer, description: Items in review across every project. }
            oldest_review_at: { type: [string, "null"], format: date-time }
            reports: { type: integer, description: Open content reports. }
            attempts: { type: integer, description: Scored qualification attempts waiting for a decision. }
            applications: { type: integer, description: Applications waiting for screening. }
            interviews: { type: integer, description: Shortlisted, qualified contributors without a passed interview. }
            identity_checks: { type: integer, description: National ID numbers given and not yet checked. }
            project_requests: { type: integer, description: Client project requests not yet converted or declined. }
        projects:
          type: array
          description: Every project that is not closed, at-risk first, then by deadline.
          items:
            type: object
            required: [id, name, status, task_type, org_id, org_name, deadline, total, final, in_review, active_contributors, reserved, gold_results, gold_accuracy, pace]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [draft, ready, live, paused] }
              task_type: { type: string }
              org_id: { type: string, format: uuid }
              org_name: { type: string }
              deadline: { type: [string, "null"], format: date }
              total: { type: integer, description: Items imported, without gold checks. }
              final: { type: integer }
              in_review: { type: integer }
              active_contributors: { type: integer, description: Contributors who submitted in the last 7 days. }
              reserved: { type: integer, description: Tasks reserved now and not yet expired. }
              gold_results: { type: integer, description: Gold checks in the last 30 days. }
              gold_accuracy: { type: [number, "null"] }
              pace: { $ref: "#/components/schemas/Pace" }
        contributors:
          type: object
          required: [applied, qualifying, active, paused, removed, worked_last_7_days, auto_paused_last_30_days, active_below_floor, building, floor, min_gold_results, watch]
          properties:
            applied: { type: integer }
            qualifying: { type: integer }
            active: { type: integer }
            paused: { type: integer }
            removed: { type: integer }
            worked_last_7_days: { type: integer }
            auto_paused_last_30_days: { type: integer }
            active_below_floor: { type: integer, description: Active with a settled trust score under the floor (paused at the next recalculation). }
            building: { type: integer, description: Active, still building a trust score. }
            floor: { type: number }
            min_gold_results: { type: integer }
            watch:
              type: array
              description: Active and paused contributors with the lowest settled trust scores (at most 8).
              items:
                type: object
                required: [id, public_code, name, status, score, gold_accuracy, scored_at, auto_paused]
                properties:
                  id: { type: string, format: uuid }
                  public_code: { type: string }
                  name: { type: string }
                  status: { type: string, enum: [active, paused] }
                  score: { type: number }
                  gold_accuracy: { type: [number, "null"] }
                  scored_at: { type: string, format: date-time }
                  auto_paused: { type: boolean, description: Paused, and the last status change was automatic. }
    Workforce:
      type: object
      required: [contributors, active_last_7_days, workers, skills]
      properties:
        contributors: { type: integer }
        active_last_7_days: { type: integer }
        workers:
          type: array
          items:
            type: object
            required: [code, tasks, last_submitted_at]
            properties:
              code: { type: string, description: "Per-organisation contributor code, for example C-K7F3Q (D-123)." }
              tasks: { type: integer }
              last_submitted_at: { type: string, format: date-time }
        skills:
          type: array
          items:
            type: object
            required: [kind, value, contributors]
            properties:
              kind: { type: string, enum: [language, domain] }
              value: { type: string }
              contributors: { type: integer }
    ActivityList:
      type: object
      required: [entries, before]
      properties:
        before: { type: [string, "null"], format: date-time, description: Pass as `before` for the next page; null on the last page. }
        entries:
          type: array
          items:
            type: object
            required: [id, at, action, actor, project_id, project_name, subject]
            properties:
              id: { type: string, format: uuid }
              at: { type: string, format: date-time }
              action: { type: string }
              actor:
                type: object
                required: [kind, name]
                properties:
                  kind: { type: string, enum: [member, mezai] }
                  name: { type: string }
              project_id: { type: [string, "null"], format: uuid }
              project_name: { type: [string, "null"] }
              subject: { type: string }
              status: { type: string }
              version: { type: string }
              file: { type: string }
              rows: { type: string }
    Member:
      type: object
      required: [id, name, email, role, status, joined_at, last_login_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [active, disabled] }
        joined_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
    Invoice:
      type: object
      required: [id, org_id, org_name, project_id, project_name, number, issued_on, due_on, amount_cents, currency, description, file_name, bytes, status, paid_on, void_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        project_id: { type: [string, "null"], format: uuid }
        project_name: { type: [string, "null"] }
        number: { type: string }
        issued_on: { type: string, format: date }
        due_on: { type: [string, "null"], format: date }
        amount_cents: { type: integer, format: int64 }
        currency: { type: string }
        description: { type: string }
        file_name: { type: string }
        bytes: { type: integer }
        status: { type: string, enum: [issued, paid, void] }
        paid_on: { type: [string, "null"], format: date }
        void_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
