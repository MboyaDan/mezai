name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mezai
          POSTGRES_PASSWORD: mezai_ci_only
          POSTGRES_DB: mezai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mezai -d mezai"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgres://mezai:mezai_ci_only@localhost:5432/mezai?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test -race -count=1 ./...

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: mezai-api:ci

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match openapi.yaml
        run: npm run gen:api:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ENABLE_DESIGN_PAGE: "1" # serve /design so axe can check it
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke (no API in CI, so the page must report a final status)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  fullstack:
    name: Full stack (AC-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API, PostgreSQL, storage and mailpit
        working-directory: backend
        run: cp .env.example .env && docker compose up -d --build --wait
      - name: Migrate and load sample data
        working-directory: backend
        run: make migrate && make seed
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Full-stack UI tests (AC-04 join and qualify, AC-05 projects and imports)
        working-directory: frontend
        run: npm run test:full
      - name: API logs
        if: failure()
        working-directory: backend
        run: docker compose logs api --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-full-report
          path: frontend/playwright-report
          retention-days: 7
